name: AIMS verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aims-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: src/backend/pom.xml
      - name: PostgreSQL Testcontainers and executable JAR
        working-directory: src/backend
        run: ./mvnw -B verify
      - name: Build runtime image
        run: docker build -t aims-backend:ci src/backend
      - name: Test production image on disposable PostgreSQL
        run: python3 tools/smoke-container.py --image aims-backend:ci
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: src/backend/target/aims-backend-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify original history and approved frontend hashes
        run: python3 tools/verify-frontend.py --source-ref
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
        working-directory: src/frontend
      - run: npm test -- --watch=false
        working-directory: src/frontend
      - run: npm run build
        working-directory: src/frontend
        env:
          NG_BUILD_MAX_WORKERS: '2'
      - run: python3 tools/verify-frontend.py --source-ref
