server:
  port: ${PORT:3000}

# Order capabilities and delivery data must not be emitted by framework payload/bind tracing.
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

spring:
  application:
    name: aims-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
